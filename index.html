<html lang="en"><head><meta charset="utf-8">

<style>
:root{color-scheme:light;--bg:#e8e2d0;--ink:#2b2438;--pn:#14122a;--tx:#f1e6c4;--bt:#3a2f6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1a2b;--ink:#efe8d8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1a2b;--ink:#efe8d8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Press Start 2P','Courier New',monospace;font-size:10px;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:10px}
h1{font-size:13px;margin:4px 0 8px;font-weight:400}
canvas{display:block;width:100%;image-rendering:pixelated;border:4px solid #5b3d26;outline:3px solid var(--pn);background:#000;aspect-ratio:5/3}
#box{background:var(--pn);color:var(--tx);border:4px solid var(--tx);outline:4px solid var(--pn);margin:12px 4px;padding:10px;min-height:96px}
#box p{margin:0 0 8px}
.o{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.o button{font:inherit;background:var(--bt);color:#fff;border:2px solid var(--tx);padding:8px 6px;cursor:pointer;text-align:left}
.o button:hover:not(:disabled){background:#5846a8}
.o button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:1px}
#sts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:8px 0}
.s{display:flex;align-items:center;gap:6px}
.s b{width:34px;font-weight:400}
.s i{flex:1;height:10px;background:var(--pn);display:block}
.s u{display:block;height:100%;background:#e0a030}
.s em{width:30px;font-style:normal;text-align:right}
#pad{display:none;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:8px}
#pad button{font:inherit;height:48px;background:var(--pn);color:var(--tx);border:2px solid var(--tx);touch-action:none}
@media (pointer:coarse){#pad{display:grid}}
</style></head><body><main>

const box=$('box');
function show(txt,opts){box.innerHTML='<p>'+txt+'</p><div class="o">'+(opts||[]).map((o,i)=>`<button data-i="${i}"${o[2]?' disabled':''}>${(opts.length>1?(i+1)+'. ':'')+o[0]}</button>`).join('')+'</div>';box._o=opts||[]}
box.onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)box._o[+b.dataset.i][1]()};
const say=m=>new Promise(r=>show(m,[['Next',r]]));
const hide=()=>{mode='walk';show('Arrows or WASD to move. Space to use things. N: night, M: day, P: music. Walk into doors to go inside, and into the mat by the door to go out.')};
const clk=()=>{const q=360+Math.floor(S.min/10)*10,h=Math.floor(q/60)%24,m=q%60;return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm')};
function ui(){PL.b=Math.min(1,((S.st.str+S.st.spd+S.st.end+S.st.tec)/4-5)/70);$('sts').innerHTML=KEYS.map(k=>`<div class="s"><b>${KN[k]}</b><i><u style="width:${Math.min(100,S.st[k]/1.2)}%"></u></i><em>${S.st[k]}</em></div>`).join('');
 $('dl').textContent=`Day ${S.day}, ${S.gold} coins, ${S.slept} hours slept in total, ${S.won.length} of 7 fights won`}
async function after(){mus('v');ui();save();if(S.min>=1200)return passOut();hide()}
async function newDay(hrs,full){S.day++;S.slept=+(S.slept+hrs).toFixed(1);S.min=0;S.en=full?100:70;put('home',5,5);S.d=0;ui();save();await say(`Day ${S.day} begins at 6:00 am. You slept ${hrs} hours (${S.slept} in total).`);hide()}
async function passOut(){mode='menu';await say('It is 2 am. You collapse from exhaustion and wake up at home.');newDay(4,0)}
function sleepMenu(){mode='menu';show('Go to bed? The day ends and you wake at 6:00 am.',[['Sleep',()=>newDay(Math.round((1440-S.min)/6)/10,1)],['Not yet',hide]])}
async function eat(){mode='menu';if(S.en>=100){await say('You are not hungry.');return hide()}
 S.en=Math.min(100,S.en+35);S.min+=30;await say('You eat lamb, bread and tea. Energy +35. Half an hour passes.');after()}

function shop(){mode='menu';const it=[['Bread, 5 coins: +15 energy',5,15,10],['Lamb plate, 12 coins: +40 energy',12,40,20]];
 show(`Market stall. You have ${S.gold} coins.`,[...it.map(([l,p,e,m])=>[l,()=>{if(S.gold<p||S.en>=100)return;S.gold-=p;S.en=Math.min(100,S.en+e);S.min+=m;ui();save();if(S.min>=1200)return passOut();shop()},S.gold<p||S.en>=100]),[S.gear?'Training gear (owned)':'Training gear, 80 coins: +25% gains',()=>{if(S.gear||S.gold<80)return;S.gold-=80;S.gear=1;ui();save();shop()},S.gear||S.gold<80],['Leave',hide]])}

async function mini(a){if(S.en<a.en){mode='menu';await say('You are too tired. Eat at home or sleep.');return hide()}

function mpress(k){const m=M;if(!m)return;
 if(m.ty=='time'&&k=='act'){m.tries++;m.fl=.25;if(Math.abs(m.pos-.5)<m.w)m.hits++;if(m.tries>=m.n)fin()}
 else if(m.ty=='mash'&&k=='act'){m.cnt++;m.fl=.08}
 else if(m.ty=='alt'&&(k=='left'||k=='right')&&k!=m.last){m.last=k;m.cnt++;m.fl=.08}
 else if(m.ty=='seq'&&k!='act'){if(k==m.q[m.i])m.hits++;m.fl=.2;m.ok=k==m.q[m.i];m.i++;m.pt=0;if(m.i>=m.n)fin()}}
function mupd(dt){const m=M;if(!m)return;m.t+=dt;m.fl=Math.max(0,m.fl-dt);
 if(m.ty=='time')m.pos=(Math.sin(m.t*3.5)+1)/2;
 else if(m.ty=='seq'){m.pt+=dt;if(m.pt>m.lim){m.i++;m.pt=0;m.ok=0;m.fl=.2;if(m.i>=m.n)fin()}}
 else if(m.t>=m.dur)fin()}

 const s=m.ty=='time'||m.ty=='seq'?m.hits/m.n:Math.min(1,m.cnt/m.goal);
 S.en=Math.max(0,S.en-m.en);S.min+=m.mn;const o=[];
 for(const k in m.g){const v=Math.max(0,Math.round((.5+s*3)*m.g[k]*(1+.25*S.gear)));S.st[k]+=v;if(v)o.push('+'+v+' '+KN[k])}
 const gd=Math.round((m.coin||0)*(.3+s));S.gold+=gd;ui();await say(`${m.t}: ${s>.8?'Excellent!':s>.5?'Good work.':s>.2?'Not bad.':'Rough session.'} ${o.join(', ')||'No gains'}${gd?', +'+gd+' coins':''}. About ${m.mn} minutes passed.${m.c?' Coach '+m.c+': “'+pick(LINES[m.c[0].toLowerCase()])+'”':''}`);after()}
